<script>

let cart = [];

function addToCart(name,price,qty){

qty = parseInt(qty);

cart.push({
name:name,
price:price,
qty:qty
});

alert(name + " added to cart");

updateCart();

}

function updateCart(){

let cartDiv =
document.getElementById("cart");

let total = 0;

cartDiv.innerHTML =
"<h2>Cart</h2>";

cart.forEach(item => {

let itemTotal =
item.price * item.qty;

cartDiv.innerHTML += `

<p>

${item.name}
-
₹${item.price}

x ${item.qty} pcs

=
₹${itemTotal}

</p>

`;

total += itemTotal;

});

cartDiv.innerHTML += `

<h3>
Total: ₹${total}
</h3>

`;

}function searchProducts(){

let input =
document.getElementById(
"searchInput"
).value.toLowerCase();

let products =
document.querySelectorAll(
".product"
);

products.forEach(product => {

let text =
product.innerText.toLowerCase();

product.style.display =
text.includes(input)
? "block"
: "none";

});

}

function sendWhatsApp(){

let name =
document.getElementById("name").value;

let phone =
document.getElementById("phone").value;

let address =
document.getElementById("address").value;

let note =
document.getElementById("note").value;

if(cart.length === 0){

alert("Cart is empty");

return;

}

let total = 0;

let message =
"New Order:%0A%0A";

cart.forEach(item => {

let itemTotal =
item.price * item.qty;

message +=
`${item.name}
- x ${item.qty} pcs
= ₹${itemTotal}%0A`;

total += itemTotal;

});

message +=
`%0ATotal: ₹${total}`;

message +=
`%0A%0AName: ${name}`;

message +=
`%0APhone: ${phone}`;

message +=
`%0AAddress: ${address}`;

message +=
`%0ANote: ${note}`;

let whatsappNumber =
"919999999999";

let url =
`https://wa.me/${whatsappNumber}?text=${message}`;

window.open(url,"_blank");

}

</script>
